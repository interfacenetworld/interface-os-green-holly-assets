name: Deploy Interface AI Speech to Cloudflare

# Manual production release only; GitHub pushes do not publish automatically.
on:
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
  SPEECH_R2_BUCKET: ${{ vars.SPEECH_R2_BUCKET }}
  SPEECH_ALLOWED_ORIGIN: ${{ vars.SPEECH_ALLOWED_ORIGIN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Prepare Cloudflare binding configuration
        run: node scripts/prepare-cloudflare.mjs
      - name: Apply remote database migrations
        run: npx wrangler d1 migrations apply interface-speech-db --remote --config wrangler.deploy.json --yes
      - name: Deploy Worker with React assets
        run: npx wrangler deploy --config wrangler.deploy.json
