name: Speech Engine CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
